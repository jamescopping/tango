[project]
name = "tango"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jamescopping", email = "james.copping97@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "watchdog>=6.0.0",
]

[project.scripts]
tango = "tango.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
